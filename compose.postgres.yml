# Knight OAuth on PostgreSQL.
#
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
#   docker compose -f compose.postgres.yml build
#   docker compose -f compose.postgres.yml run --rm knight-oauth \
#       node scripts/prisma.js migrate deploy
#   docker compose -f compose.postgres.yml up -d
#
# A separate file rather than a block of comments inside compose.yml to
# uncomment. The instructions this replaces asked for six edits in the right
# order, and getting them wrong produced either invalid YAML or — worse — a
# service that came up against the wrong database. A file that is either used or
# not cannot be half-applied.
#
# compose.yml remains the zero-config SQLite path and is unaffected by this one.

services:
  knight-oauth:
    build:
      context: .
      # Read from the environment rather than pinned, and defaulted to the
      # provider this file exists for.
      #
      # Prisma cannot take `datasource provider` from an environment variable, so
      # the client is generated for one provider at build time and the choice is
      # baked into the image. Pinning this to a literal is how an image ends up
      # holding the SQLite client while DATABASE_URL below points at PostgreSQL:
      # the service starts, answers discovery, and fails every request that
      # touches a table.
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    # A distinct tag, so building this file cannot silently replace the image
    # built from compose.yml, or be replaced by it.
    image: knight-oauth:postgres
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_PROVIDER: postgresql
      # The host is the service name below, resolved on the compose network. The
      # database port is not published to the host at all.
      DATABASE_URL: postgresql://knight_oauth:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/knight_oauth

      # What browsers and clients use to reach the issuer. Every URL in the
      # discovery document is built from it, so it has to be the address a client
      # actually resolves, not the container's own view of itself. Change this
      # first when putting the service behind a domain.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3010}
      NODE_ENV: ${NODE_ENV:-production}

      # The two settings below are what make this file work out of the box, and
      # both are safety defaults that NODE_ENV=production deliberately turns off.
      # They are set here, explicitly and overridably, rather than by weakening
      # the defaults themselves.
      #
      # Change both when putting this on a real domain: serve HTTPS and set
      # PUBLIC_BASE_URL to the https address, then supply a key through
      # OAUTH_SIGNING_KEYS_JSON from a secret manager and set these to false.
      #
      # http is only tolerable because the port below is bound to loopback. On a
      # reachable address it exposes every token in transit.
      OAUTH_ALLOW_INSECURE_HTTP: ${OAUTH_ALLOW_INSECURE_HTTP:-true}
      # The generated key is stored in PostgreSQL, so it already survives the
      # container being replaced. With more than one replica, or when the key
      # should be rotatable independently of the data, configure
      # OAUTH_SIGNING_KEYS_JSON instead.
      OAUTH_ALLOW_GENERATED_KEYS: ${OAUTH_ALLOW_GENERATED_KEYS:-true}
      # Behind a reverse proxy that terminates TLS, set TRUST_PROXY=true and
      # PUBLIC_BASE_URL to the https address. Leave it false when the port below
      # is exposed directly: with no proxy in front, a client can spoof its own
      # address past the rate limiter.
      TRUST_PROXY: ${TRUST_PROXY:-false}

      # Migrations are not applied on start here, which is the entrypoint's
      # default for PostgreSQL and the reason the `run --rm ... migrate deploy`
      # step above is a separate command: several replicas racing to migrate the
      # same database is a real way to corrupt one. Set OAUTH_MIGRATE_ON_START=true
      # only for a single-container deployment.

    ports:
      # Bound to the loopback address deliberately. OAuth over plaintext http
      # exposes tokens in transit, so nothing here should be reachable off the
      # host until there is a TLS terminator in front of it. Publish on 0.0.0.0
      # only once that is true.
      - "127.0.0.1:3010:3010"

    # No volume. On PostgreSQL the container writes nothing to disk — the
    # database, and the signing key inside it, live in the postgres service.

    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0

    # /healthz reports unavailable when the signing key cannot be resolved, which
    # is the failure that otherwise looks like a healthy container serving 500s.
    # Run through node rather than curl: the image has no curl, and adding one to
    # a minimal runtime image for a health check is the wrong trade.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: knight_oauth
      POSTGRES_USER: knight_oauth
      # No default. A database holding password hashes and signing keys must not
      # come up with a password that is published in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published. Only the service above needs to reach it, and exposing a
    # database port to the host is how one ends up reachable from the network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knight_oauth -d knight_oauth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # The accounts, the issued grants, and the signing key. `docker compose -f
  # compose.postgres.yml down` keeps it; adding -v deletes it, and every token
  # already issued becomes unverifiable.
  postgres-data:
